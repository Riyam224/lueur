name: lueur
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  cached_network_image: ^3.3.1
  confetti: ^0.8.0
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  dio: ^5.9.2
  equatable: ^2.0.5
  firebase_auth: ^6.5.4
  firebase_core: ^4.11.0
  firebase_analytics: ^12.4.5
  google_sign_in: ^6.2.2
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  get_it: ^9.2.1
  go_router: ^17.3.0
  google_fonts: ^8.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  logger: ^2.0.2
  lottie: ^3.3.2
  pretty_dio_logger: ^1.4.0
  screenshot: ^3.0.0
  share_plus: ^10.1.4
  shared_preferences: ^2.5.3
  sentry_flutter: ^8.14.2
  sentry_dio: ^8.14.2

dev_dependencies:
  sentry_dart_plugin: ^3.4.0
  flutter_launcher_icons: "^0.14.4"
  build_runner: ^2.4.9
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
    # code generation
  hive_generator: ^2.0.1
  json_serializable: ^6.8.0
# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  generate: true

  # Assets
  assets:
    - assets/illustrations/
    - assets/emojis/
    - assets/icons/
    - assets/lottie/
    - assets/images/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Light.ttf
          weight: 300
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
    - family: DMSerifDisplay
      fonts:
        - asset: assets/fonts/DMSerifDisplay-Regular.ttf
        - asset: assets/fonts/DMSerifDisplay-Italic.ttf
          style: italic
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images
  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package
  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# NOTE: flutter_native_splash renders before the Flutter engine (and its
# fonts/widgets) is up, so it can only show a flat background color + one
# static image — no custom text, shapes, or animation. The colors below
# must be kept in sync with AppColors.creamBackground (light) and
# AppColors.darkBackground (dark) by hand, since this YAML config can't
# reference Dart constants. The in-app SplashScreen centers this same Luna
# asset on the same background and adds the "Lueur" wordmark + tagline —
# same image, same backdrop, so there's no jump-cut when Flutter takes over.
flutter_native_splash:
  color: "#F8F2E7"
  image: assets/images/luna_splash.png
  color_dark: "#2B2138"
  image_dark: assets/images/luna_splash.png
  android_12:
    image: assets/images/luna_splash_android12.png
    color: "#F8F2E7"
    color_dark: "#2B2138"
  android: true
  ios: true
  web: false
  fullscreen: true



flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: lueur-frontend
  org: ther-71
